<!DOCTYPE html>
<html>
<head>
<title>Top Bottom Moving Text</title>
<style>
body {
    margin: 0;
    font-family: Arial;
}

/* Top Section */
.top {
    background: linear-gradient(to right, blue, lightblue); /* gradient */
    color: white;
    height: 50px;              /* fixed height */
    line-height: 50px;         /* text vertically center */
    font-size: 20px;
    font-weight: bold;
    overflow: hidden;
    position: relative;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3); /* shadow effect */
}
.top span {
    display: inline-block;
    white-space: nowrap;
    position: absolute;
    animation: moveLeft 18s linear infinite; /* speed control */
}
.top span:hover {
    animation-play-state: paused; /* hover pause */
}

/* Bottom Section */
.bottom {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: linear-gradient(to right, red, orange); /* gradient */
    color: white;
    height: 50px;              /* fixed height */
    line-height: 50px;         /* text vertically center */
    font-size: 20px;
    font-weight: bold;
    overflow: hidden;
    box-shadow: 0 -4px 6px rgba(0,0,0,0.3); /* shadow effect */
}
.bottom span {
    display: inline-block;
    white-space: nowrap;
    position: absolute;
    animation: moveRight 18s linear infinite; /* speed control */
}
.bottom span:hover {
    animation-play-state: paused; /* hover pause */
}

/* Animations */
@keyframes moveLeft {
    from { left: 100%; }
    to { left: -100%; }
}

@keyframes moveRight {
    from { right: 100%; }
    to { right: -100%; }
}
</style>
</head>
<body>

<div class="top">
    <span>Welcome to TMS PG college | Purauttam jamalapur jaunpur | Admission Open</span>
</div>

<div class="bottom">
    <span>Important Notice | Contact Us | New Admission Started BCA, BA, BSc, BCom, MA, MSc, MCom & Pharmacy B.pharma, D.pharma</span>
</div>

</body>
</html>
