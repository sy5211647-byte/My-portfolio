<!DOCTYPE html>
<html>
<head>
    <title>Student ID Card</title>

    <style>
        .id-card {
            width: 350px;
            height: 500px;
            border: 2px solid #000;
            border-radius: 15px;
            text-align: center;
            font-family: Arial;
            margin: 50px auto;
            overflow: hidden;
        }

        .header {
            background: #ff9933;
            padding: 15px;
            color: white;
        }

        .photo {
            width: 120px;
            height: 140px;
            border: 2px solid #000;
            margin: 20px auto;
        }

        .photo img {
            width: 100%;
            height: 100%;
        }

        .details {
            text-align: left;
            padding: 10px 30px;
            line-height: 1.8;
        }

        .footer {
            background: #138808;
            color: white;
            padding: 10px;
        }
    </style>
</head>

<body>

<div class="id-card">

    <div class="header">
        <h2>TMS PG COLLEGE</h2>
        <p>STUDENT ID CARD</p>
    </div>

    <div class="photo">
        <img src="photo.png" alt="Student Photo">
    </div>

    <div class="details">
        <b>Name:</b> Sandeep yadav <br>
        <b>Father Name:</b> Mr Monu yadav <br>
        <b>Course:</b> BCA<br>
        <b>Roll No:</b> 123456<br>
        <b>Session:</b> 2026-27<br>
        <b>Contact:</b> 74497990686
    </div>

    <div class="footer">
        Valid Student ID Card
    </div>

</div>

</body>
</html>
